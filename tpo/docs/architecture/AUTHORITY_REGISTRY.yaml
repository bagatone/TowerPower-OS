variety_traceability_code_master:
  status: OWNER_APPROVED
  authority: docs/OPERATING_RULES.md#3-lotti
  code_format: "^[A-Z]{3}$"
  canonical_codes:
    - {code: AFI, variety: "Afila / Guisantes"}
    - {code: RAB, variety: "Rábano Morado"}
    - {code: CIL, variety: Cilantro}
    - {code: MIZ, variety: "Mizuna Roja"}
    - {code: HIN, variety: Hinojo}
    - {code: ALB, variety: Albahaca}
    - {code: GIR, variety: Girasol}
    - {code: COL, variety: "Col Roja"}
    - {code: MOS, variety: Mostaza}
    - {code: LEN, variety: Lentejas}
    - {code: PAK, variety: "Pak Choi"}
    - {code: RUC, variety: Rúcula}
    - {code: AMA, variety: "Amaranto Rojo"}
    - {code: ACE, variety: "Acedera / Vinagrera"}
  permanent_rules:
    - "Codes are explicit configuration and are never derived from denominations."
    - "Codes are unique, permanent after assignment and never reassigned."
    - "A discontinued variety retains its reserved code."
    - "Display or commercial denomination changes do not change the code."
    - "The code is the AAA component of canonical Semina traceability AAA-GGMM-L."
  name_equivalences:
    - {names: [Afila, Guisantes], code: AFI}
    - {names: [Rábano, "Rábano Morado"], code: RAB}
    - {names: [Mizuna, "Mizuna Roja"], code: MIZ}
    - {names: [Albahaca, Basilico], code: ALB}
    - {names: [Acedera, Vinagrera], code: ACE}
  forbidden_new_production_codes:
    - {code: BAS, classification: LEGACY_DEMO_SUPERSEDED, canonical_replacement: ALB}
    - {code: VIN, classification: FORBIDDEN_DUPLICATE, canonical_replacement: ACE}
  permanently_reserved_outside_production: [MOS]
  explicitly_not_authorized_or_reserved:
    - {code: BAR, name: Barilla}

raccolta_authority_v1:
  status: OWNER_APPROVED
  prior_art_gate: PASSED
  identity: {type: RaccoltaId, format: "^RAC-[0-9]{6,}$", prefix: RAC, sequence: RACCOLTA_ID}
  cardinality: {semina_to_raccolta: "1:0..N", raccolta_to_semina: "N:1"}
  eligible_semina_states: [PRONTA_ALLA_RACCOLTA]
  automatic_semina_transition: FORBIDDEN
  automatic_semina_closure: FORBIDDEN
  quantity: {uom: SET, precision: 20, scale: 6, positive: true, fractional: true}
  time_authority: {effective_at: tpo.raccolte.data_raccolta, recorded_at: tpo.raccolte.created_at, timezone: Atlantic/Canary}
  traceability: {authority: tpo.semine.codice_tracciabilita, authoritative_raccolta_snapshot: FORBIDDEN, second_production_lot: FORBIDDEN}
  mutability: {update: FORBIDDEN, delete: FORBIDDEN}
  idempotency: {authority: tpo.raccolta_recording_requests, compatible_replay: SAME_RACCOLTA, changed_payload: TYPED_CONFLICT}
  stock_boundary: {direct_stock_mutation: FORBIDDEN, automatic_movement: FORBIDDEN}
  destination_as_assignment: FORBIDDEN
  quality_authority: DEFERRED
  correction_implementation: IMPLEMENTED
  correction_authority:
    freeze: docs/architecture/RACCOLTA_CORREZIONE_AUTHORITY_FREEZE.md
    command: CorreggiRaccolta
    cli: "tpo raccolta correggi"
    persistence: tpo.raccolte.rettifica_raccolta_id
    identity: {allocation: SAME_SEQUENCE, sequence: RACCOLTA_ID}
    idempotency: tpo.raccolta_correzione_requests
    original_mutation: FORBIDDEN
    chained_correction: FORBIDDEN
    cross_semina_correction: FORBIDDEN
    cross_uom_correction: FORBIDDEN
    net_quantity_negative: FORBIDDEN
    semina_state_gate: NOT_REQUIRED
  actor_authority: CORE_AUTHORITY_CONTEXT

semente_authority_v1:
  status: OWNER_APPROVED
  prior_art_gate: PASSED
  identity: {public_identity: NONE, public_sequence: NONE, technical_persistence_identity: "internal bigint tpo.sementi.id"}
  business_identity: {fields: [fornitore, referenza_commerciale], normalization: "lower(btrim(fornitore)) + lower(btrim(referenza_commerciale))", uniqueness_backstop: uq_sementi_fornitore_referenza_normalized}
  constitutive_fields: [fornitore, referenza_commerciale]
  metadata_fields: [marca, formato, trattamento, certificazioni]
  state_model: {field: attiva, type: boolean, additional_states: FORBIDDEN}
  creation_authority: CommissionSemente
  idempotency: {authority: tpo.semente_commissioning_requests, compatible_replay: SAME_SEMENTE, changed_payload: TYPED_CONFLICT, implementation_status: IMPLEMENTED}
  mutability: {fornitore: FORBIDDEN, referenza_commerciale: FORBIDDEN, metadata_correction: DEFERRED, activation_deactivation: DEFERRED}
  semente_impiego_relationship: {automatic_creation: FORBIDDEN, required_for_semente_creation: false, required_for_lotto_seme_creation: false, required_for_semina_commissioning: true}
  articolo_coupling: DEFERRED
  fornitore_master_authority: NONE
  forbidden_duplicates: [SEMENTE_ID, SEMENTE_PUBLIC_SEQUENCE, PROTOCOLLO_VERSIONE_AS_SEMENTE_IDENTITY, SEMENTE_ARTICOLO_AUTOMATIC_LINK, SEMENTE_IMPIEGO_AUTOMATIC_LINK]
  actor_authority: CORE_AUTHORITY_CONTEXT

semente_impiego_authority_v1:
  status: OWNER_APPROVED
  prior_art_gate: PASSED
  identity: {public_identity: NONE, public_sequence: NONE, technical_persistence_identity: "internal bigint tpo.semente_impieghi.id"}
  business_identity: {fields: [semente_id, cultivar_uso_id], resolution: "fornitore+referenza_commerciale resolves semente_id; approved and currently-valid PROTOCOLLO_VERSIONE resolves cultivar_uso_id", uniqueness_backstop: uq_semente_impieghi_semente_cultivar_uso}
  evaluation_fields: [raccomandazione, rating, motivazione]
  evaluation_date_authority: {field: ultima_revisione, source: writer_owned_current_date, caller_input: FORBIDDEN}
  creation_authority: CommissionSementeImpiego
  idempotency: {authority: tpo.semente_impiego_commissioning_requests, compatible_replay: SAME_SEMENTE_IMPIEGO, changed_payload: TYPED_CONFLICT, implementation_status: IMPLEMENTED}
  mutability: {semente_id: FORBIDDEN, cultivar_uso_id: FORBIDDEN, evaluation_revision: DEFERRED}
  prerequisite_ordering: {requires_active_semente: true, requires_lotto_seme: false, required_for_semina_commissioning: true}
  forbidden_duplicates: [SEMENTE_IMPIEGO_ID, SEMENTE_IMPIEGO_PUBLIC_SEQUENCE, SILENT_CONVERGENCE_ON_DIFFERENT_REQUEST, CALLER_SUPPLIED_ULTIMA_REVISIONE]
  actor_authority: CORE_AUTHORITY_CONTEXT

