<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario — Tower Power</title>
<style>
  :root{
    --bg:#F5F3EC; --surface:#FFFFFF; --border:#E3DFD0; --text:#1C231D;
    --muted:#646F5E; --accent:#6D28D9; --accent-strong:#5416B8;
    --good:#2E8B54; --good-soft:#E3F2E7; --bad:#BC3B31; --bad-soft:#FBE6E3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12160F; --surface:#1B2118; --border:#33392E; --text:#EDEAE0;
      --muted:#A2AC97; --accent:#B08CF0; --accent-strong:#C7ABF5;
      --good:#5CBA82; --good-soft:#1B2E20; --bad:#E38177; --bad-soft:#3A2019;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  textarea{
    width:100%; min-height:90px; font:inherit; font-size:16px; padding:12px;
    border-radius:10px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); resize:vertical;
  }
  button{
    font:inherit; font-size:15px; font-weight:600; padding:12px 18px;
    border-radius:10px; border:1px solid var(--accent); background:var(--accent);
    color:#fff; cursor:pointer; margin-top:10px;
  }
  button:active{background:var(--accent-strong);}
  button.secondary{background:transparent; color:var(--muted); border-color:var(--border);}
  button:disabled{opacity:.5; cursor:default;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-top:14px;
  }
  .card h3{margin:0 0 8px; font-size:15px;}
  .card .riga{display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:14px;}
  .card .riga .k{color:var(--muted);}
  .errore{
    background:var(--bad-soft); color:var(--bad); border-radius:10px;
    padding:10px 14px; margin-top:10px; font-size:14px;
  }
  .esito{
    background:var(--good-soft); color:var(--good); border-radius:10px;
    padding:10px 14px; margin-top:10px; font-size:14px; white-space:pre-wrap;
  }
  .esito.fallito{background:var(--bad-soft); color:var(--bad);}
  .stato{font-size:13px; color:var(--muted); margin-top:10px;}
  .rendiconto{margin-bottom:24px;}
  .rendiconto h2{font-size:16px; margin:18px 0 8px;}
  .rendiconto h2:first-child{margin-top:0;}
  .riga-r{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-top:6px; font-size:14px; display:flex;
    justify-content:space-between; gap:10px; align-items:baseline;
  }
  .riga-r.chiarire{border-color:var(--bad); background:var(--bad-soft);}
  .riga-r .principale{font-weight:600;}
  .riga-r .dettaglio{color:var(--muted); font-size:13px;}
  .riga-r.chiarire .dettaglio{color:var(--bad);}
  .rendiconto .vuoto{color:var(--muted); font-size:14px; padding:4px 0;}
  .semine{margin-bottom:24px;}
  .semine h2{font-size:16px; margin:0 0 8px;}
  .sessione{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-top:8px;
  }
  .sessione h3{margin:0 0 2px; font-size:15px; text-transform:capitalize;}
  .sessione .tot{color:var(--muted); font-size:13px; margin-bottom:6px;}
  .sessione .var{padding:8px 0; border-top:1px solid var(--border);}
  .sessione .var:first-of-type{border-top:0;}
  .sessione .var .nome{display:flex; justify-content:space-between; gap:10px; font-weight:600;}
  .sessione .var .nome .g{color:var(--muted); font-weight:400; font-size:13px;}
  .sessione .dest{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:2px 0 0 10px;}
  .sessione .dest .d{color:var(--muted); font-size:13px;}
  .sessione .nota{color:var(--bad); font-size:13px; padding:0 0 2px 10px;}
  .semine .avviso{background:var(--bad-soft); color:var(--bad); border-radius:10px; padding:8px 12px; margin-top:8px; font-size:13px;}
  .semine .avviso .n{font-weight:400; margin:2px 0 6px;}
  .semine .avviso .ord{color:var(--text); padding:4px 0; border-top:1px solid var(--border);}
  .semine .avviso .ord .v{color:var(--muted);}
  .semine .vuoto,.semine .piu{color:var(--muted); font-size:14px; padding:4px 0;}
  .incassi{margin-bottom:24px;}
  .incassi h2{font-size:16px; margin:0 0 8px;}
  .incassi .cliente{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-top:8px;
  }
  .incassi .cliente h3{margin:0 0 6px; font-size:15px;}
  .incassi label.cons{display:flex; gap:10px; align-items:flex-start; padding:5px 0; font-size:14px; cursor:pointer;}
  .incassi label.cons input{margin-top:4px; width:18px; height:18px; flex:none;}
  .incassi .cons .dettaglio{color:var(--muted); font-size:13px;}
  .incassi .cons .vecchia{color:var(--bad);}
  .incassi .azioni{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px;}
  .incassi select{
    font:inherit; font-size:15px; padding:11px 10px; border-radius:10px; margin-top:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .incassi .vuoto{color:var(--muted); font-size:14px; padding:4px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Diario Tower Power</h1>
  <div class="sub">Scrivi cosa è successo. Ti mostro l'azione esatta prima di registrarla.</div>

  <div id="rendiconto" class="rendiconto"><div class="vuoto">Carico il rendiconto di oggi…</div></div>

  <div id="semine" class="semine"><div class="vuoto">Carico il piano semine…</div></div>

  <div id="incassi" class="incassi"><div class="vuoto">Carico le consegne da incassare…</div></div>

  <textarea id="testo" placeholder='Es. "Mizuna e Rábano sono passate in luce", "Seminato 2 set di rucola", "Splash ha pagato in contanti"'></textarea>
  <div>
    <button id="btnInterpreta">Interpreta</button>
  </div>
  <div id="stato" class="stato"></div>
  <div id="risultati"></div>
</div>

<script>
const testoEl = document.getElementById("testo");
const statoEl = document.getElementById("stato");
const risultatiEl = document.getElementById("risultati");
const btnInterpreta = document.getElementById("btnInterpreta");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function campo(k, v) {
  return `<div class="riga"><span class="k">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`;
}

function cardProposta(p, idx) {
  const div = document.createElement("div");
  div.className = "card";
  if (p.tipo === "semina_commission") {
    div.innerHTML = `
      <h3>Nuova semina — ${escapeHtml(p.varieta_nome)}</h3>
      ${campo("Set", p.num_set)}
      ${campo("Grammi", p.grammi + " g")}
      ${campo("Lotto seme", p.lotto_seme_public_id)}
      ${campo("Protocollo", p.protocollo_versione_public_id)}
      ${campo("Origine", p.origin)}
      ${campo("Avvio", p.physical_started_at)}
      ${campo("Residuo dopo", p.residuo_dopo + " g")}
    `;
  } else if (p.tipo === "pagamento_consegna") {
    const consegne = p.consegne.map((c) =>
      `<div class="riga"><span class="k">${escapeHtml(c.codice)} · ${escapeHtml(c.data)}</span>` +
      `<span>${escapeHtml((c.voci || []).join(", ") || "—")}</span></div>`).join("");
    div.innerHTML = `
      <h3>Pagamento — ${escapeHtml(p.cliente_nome)}</h3>
      ${consegne}
      ${campo("Metodo", p.metodo)}
      ${campo("Data pagamento", p.data_pagamento)}
      ${p.importo ? campo("Importo", p.importo) : ""}
    `;
  } else {
    div.innerHTML = `
      <h3>Cambio stadio — ${escapeHtml(p.varieta_nome)}</h3>
      ${campo("Semina", p.semina_public_id)}
      ${campo("Da", p.stato_attuale)}
      ${campo("A", p.passi[p.passi.length - 1])}
      ${p.passi.length > 1 ? campo("Passi", p.passi.join(" → ")) : ""}
    `;
  }
  const btn = document.createElement("button");
  btn.textContent = "Conferma ed esegui";
  const btnAnnulla = document.createElement("button");
  btnAnnulla.textContent = "Annulla";
  btnAnnulla.className = "secondary";
  const esitoDiv = document.createElement("div");
  btn.onclick = async () => {
    btn.disabled = true; btnAnnulla.disabled = true;
    btn.textContent = "Eseguo…";
    try {
      const r = await fetch("/api/conferma", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({proposta: p}),
      });
      const data = await r.json();
      esitoDiv.className = "esito" + (data.ok ? "" : " fallito");
      esitoDiv.textContent = data.messaggio;
      btn.remove(); btnAnnulla.remove();
      if (data.ok && p.tipo === "pagamento_consegna") caricaIncassi();
    } catch (e) {
      esitoDiv.className = "esito fallito";
      esitoDiv.textContent = "Errore di rete: " + e;
    }
  };
  btnAnnulla.onclick = () => div.remove();
  div.appendChild(document.createElement("div"));
  const azioni = document.createElement("div");
  azioni.appendChild(btn); azioni.appendChild(btnAnnulla);
  div.appendChild(azioni);
  div.appendChild(esitoDiv);
  return div;
}

function rigaConsegna(x) {
  return `<div class="riga-r">
    <div><span class="principale">${escapeHtml(x.cliente)}</span> — ${escapeHtml(x.varieta)}</div>
    <div class="dettaglio">${escapeHtml(x.quantita)} ${escapeHtml(x.unita)} · ${escapeHtml(x.ordine)}</div>
  </div>`;
}
function rigaChiarire(x) {
  return `<div class="riga-r chiarire">
    <div><span class="principale">${escapeHtml(x.cliente)}</span> — ${escapeHtml(x.varieta)}</div>
    <div class="dettaglio">${escapeHtml(x.motivo)}</div>
  </div>`;
}
function rigaSemina(x) {
  return `<div class="riga-r">
    <div><span class="principale">${escapeHtml(x.varieta)}</span> per ${escapeHtml(x.cliente)}</div>
    <div class="dettaglio">${escapeHtml(x.quantita)} ${escapeHtml(x.unita)} · ${escapeHtml(x.stato)}</div>
  </div>`;
}

async function caricaRendiconto() {
  const el = document.getElementById("rendiconto");
  try {
    const r = await fetch("/api/rendiconto");
    const data = await r.json();
    if (data.errore) {
      el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`;
      return;
    }
    const nulla = !(data.da_chiarire || []).length && !(data.consegne || []).length
      && !(data.da_seminare || []).length;
    if (nulla) {
      el.innerHTML = `<div class="vuoto">Rendiconto del ${escapeHtml(data.data)}: nessuna consegna né semina in scadenza oggi.</div>`;
      return;
    }
    let html = "";
    if ((data.da_chiarire || []).length) {
      html += `<h2>Da chiarire</h2>` + data.da_chiarire.map(rigaChiarire).join("");
    }
    if ((data.consegne || []).length) {
      html += `<h2>Consegne di oggi</h2>` + data.consegne.map(rigaConsegna).join("");
    }
    if ((data.da_seminare || []).length) {
      html += `<h2>Da seminare oggi</h2>` + data.da_seminare.map(rigaSemina).join("");
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="errore">Rendiconto non caricato: ${escapeHtml(String(e))}</div>`;
  }
}
caricaRendiconto();

function mostraEsito(data) {
  risultatiEl.innerHTML = "";
  (data.proposte || []).forEach((p, i) => risultatiEl.appendChild(cardProposta(p, i)));
  (data.errori || []).forEach((e) => {
    const d = document.createElement("div");
    d.className = "errore";
    d.textContent = e;
    risultatiEl.appendChild(d);
  });
  risultatiEl.scrollIntoView({behavior: "smooth", block: "start"});
}

async function preparaPagamento(codici, metodo) {
  statoEl.textContent = "Preparo la proposta…";
  try {
    const r = await fetch("/api/pagamento/prepara", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({consegne: codici, metodo}),
    });
    statoEl.textContent = "";
    mostraEsito(await r.json());
  } catch (e) {
    statoEl.textContent = "Errore: " + e;
  }
}

function bloccoCliente(c, metodi) {
  const div = document.createElement("div");
  div.className = "cliente";
  const righe = c.consegne.map((x) => {
    const vecchia = x.giorni >= 14 ? " vecchia" : "";
    const quanto = x.giorni === 1 ? "1 giorno" : x.giorni + " giorni";
    return `<label class="cons"><input type="checkbox" value="${escapeHtml(x.codice)}" checked>
      <span><strong>${escapeHtml(x.codice)}</strong> · ${escapeHtml(x.data)}
      <span class="dettaglio${vecchia}">(${escapeHtml(quanto)})</span><br>
      <span class="dettaglio">${escapeHtml(x.voci.join(", ") || "—")}</span></span></label>`;
  }).join("");
  const opzioni = `<option value="">Metodo…</option>` +
    metodi.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
  div.innerHTML = `<h3>${escapeHtml(c.cliente)}</h3>${righe}
    <div class="azioni"><select>${opzioni}</select><button type="button">Segna come pagate</button></div>`;
  const sel = div.querySelector("select");
  div.querySelector("button").onclick = () => {
    const scelte = [...div.querySelectorAll("input:checked")].map((i) => i.value);
    if (!scelte.length) { statoEl.textContent = "Seleziona almeno una consegna."; return; }
    if (!sel.value) { statoEl.textContent = "Scegli il metodo di pagamento."; return; }
    preparaPagamento(scelte, sel.value);
  };
  return div;
}

async function caricaIncassi() {
  const el = document.getElementById("incassi");
  try {
    const r = await fetch("/api/da-incassare");
    const data = await r.json();
    if (data.errore) {
      el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`;
      return;
    }
    if (!(data.clienti || []).length) {
      el.innerHTML = `<h2>Da incassare</h2><div class="vuoto">Tutte le consegne sono pagate.</div>`;
      return;
    }
    const n = data.clienti.reduce((a, c) => a + c.consegne.length, 0);
    el.innerHTML = `<h2>Da incassare · ${n} consegn${n === 1 ? "a" : "e"}, ${data.clienti.length} client${data.clienti.length === 1 ? "e" : "i"}</h2>`;
    data.clienti.forEach((c) => el.appendChild(bloccoCliente(c, data.metodi)));
  } catch (e) {
    el.innerHTML = `<div class="errore">Elenco non caricato: ${escapeHtml(String(e))}</div>`;
  }
}
caricaIncassi();

function numero(x) { return String(x); }
function dataBreve(iso) { const [, m, d] = iso.split("-"); return `${d}/${m}`; }

async function caricaSemine() {
  const el = document.getElementById("semine");
  try {
    const r = await fetch("/api/sessioni-semina");
    const data = await r.json();
    if (data.errore) { el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`; return; }
    el.innerHTML = `<h2>Prossime semine · ${escapeHtml(data.giorni.join(" e "))}</h2>`;
    if (!data.sessioni.length) {
      el.insertAdjacentHTML("beforeend", `<div class="vuoto">Nessuna semina da fare nelle sessioni.</div>`);
    }
    data.sessioni.forEach((s) => {
      const tot = Object.entries(s.totali).map(([u, q]) => `${q} ${u}`).join(", ");
      const vars = s.varieta.map((v) => {
        const dest = v.destinatari.map((d) => `
          <div class="dest"><span>${escapeHtml(d.cliente)} · ${escapeHtml(d.quantita)}</span>
          <span class="d">consegna ${escapeHtml(dataBreve(d.consegna))} · ${escapeHtml(d.ordine)}</span></div>` +
          d.note.map((n) => `<div class="nota">${escapeHtml(n)}</div>`).join("")).join("");
        return `<div class="var"><div class="nome"><span>${escapeHtml(v.varieta)} · ${escapeHtml(v.quantita)} ${escapeHtml(v.unita)}</span>
          <span class="g">${escapeHtml(v.grammi)} g di seme</span></div>${dest}</div>`;
      }).join("");
      el.insertAdjacentHTML("beforeend", `<div class="sessione"><h3>${escapeHtml(s.giorno)} ${escapeHtml(dataBreve(s.data))}${s.oggi ? " · oggi" : ""}</h3>
        <div class="tot">${s.varieta.length} varietà · ${escapeHtml(tot)}</div>${vars}</div>`);
    });
    if (data.piu_avanti) {
      el.insertAdjacentHTML("beforeend", `<div class="piu">Più avanti: ${data.piu_avanti === 1 ? "un'altra riga" : "altre " + data.piu_avanti + " righe"}, fino al ${escapeHtml(dataBreve(data.ultima_data_piu_avanti))}.</div>`);
    }
    const elencoOrdini = (titolo, nota, ordini, ritardo) => {
      if (!ordini.length) return;
      const righe = ordini.map((o) => `<div class="ord"><b>${escapeHtml(o.cliente)}</b> · ${escapeHtml(o.ordine)}
        · ${ritardo ? "consegna" : "prevista"} ${escapeHtml(dataBreve(o.consegna))}${ritardo ? ` · piano in ritardo di ${o.ritardo_giorni} gg` : ""}
        <div class="v">${o.voci.map(escapeHtml).join(", ")}</div></div>`).join("");
      el.insertAdjacentHTML("beforeend", `<div class="avviso"><b>${escapeHtml(titolo)} (${ordini.length})</b>
        <div class="n">${escapeHtml(nota)}</div>${righe}</div>`);
    };
    elencoOrdini("Da verificare", "Consegna troppo vicina per una semina nuova: coperti da giacenza o semine in corso? Consegna da spostare?",
      data.da_verificare || [], true);
    elencoOrdini("Ordini scaduti", "Consegna prevista passata e ordine ancora aperto: se il residuo non è più dovuto, da chiudere.",
      data.scaduti || [], false);
  } catch (e) {
    el.innerHTML = `<div class="errore">Piano semine non caricato: ${escapeHtml(String(e))}</div>`;
  }
}
caricaSemine();

btnInterpreta.onclick = async () => {
  const testo = testoEl.value.trim();
  if (!testo) return;
  btnInterpreta.disabled = true;
  statoEl.textContent = "Interpreto…";
  risultatiEl.innerHTML = "";
  try {
    const r = await fetch("/api/interpreta", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({testo}),
    });
    const data = await r.json();
    statoEl.textContent = "";
    (data.proposte || []).forEach((p, i) => risultatiEl.appendChild(cardProposta(p, i)));
    (data.errori || []).forEach((e) => {
      const d = document.createElement("div");
      d.className = "errore";
      d.textContent = e;
      risultatiEl.appendChild(d);
    });
    if (!(data.proposte || []).length && !(data.errori || []).length) {
      statoEl.textContent = "Nessuna proposta.";
    }
  } catch (e) {
    statoEl.textContent = "Errore: " + e;
  } finally {
    btnInterpreta.disabled = false;
  }
};
</script>
</body>
</html>
