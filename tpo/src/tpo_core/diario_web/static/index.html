<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario — Tower Power</title>
<style>
  :root{
    --bg:#F5F3EC; --surface:#FFFFFF; --border:#E3DFD0; --text:#1C231D;
    --muted:#646F5E; --accent:#6D28D9; --accent-strong:#5416B8;
    --good:#2E8B54; --good-soft:#E3F2E7; --bad:#BC3B31; --bad-soft:#FBE6E3;
  }
  /* sempre sfondo chiaro (scelta di Matteo, 17/10/2026): niente modo scuro */
  :root{color-scheme:light;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  textarea{
    width:100%; min-height:90px; font:inherit; font-size:16px; padding:12px;
    border-radius:10px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); resize:vertical;
  }
  button{
    font:inherit; font-size:15px; font-weight:600; padding:12px 18px;
    border-radius:10px; border:1px solid var(--accent); background:var(--accent);
    color:#fff; cursor:pointer; margin-top:10px;
  }
  button:active{background:var(--accent-strong);}
  button.secondary{background:transparent; color:var(--muted); border-color:var(--border);}
  button:disabled{opacity:.5; cursor:default;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-top:14px;
  }
  .card h3{margin:0 0 8px; font-size:15px;}
  .card .riga{display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:14px;}
  .card .riga .k{color:var(--muted);}
  .errore{
    background:var(--bad-soft); color:var(--bad); border-radius:10px;
    padding:10px 14px; margin-top:10px; font-size:14px;
  }
  .esito{
    background:var(--good-soft); color:var(--good); border-radius:10px;
    padding:10px 14px; margin-top:10px; font-size:14px; white-space:pre-wrap;
  }
  .esito.fallito{background:var(--bad-soft); color:var(--bad);}
  .stato{font-size:13px; color:var(--muted); margin-top:10px;}
  .rendiconto{margin-bottom:24px;}
  .rendiconto h2{font-size:16px; margin:18px 0 8px;}
  .rendiconto h2:first-child{margin-top:0;}
  .riga-r{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-top:6px; font-size:14px; display:flex;
    justify-content:space-between; gap:10px; align-items:baseline;
  }
  .riga-r.chiarire{border-color:var(--bad); background:var(--bad-soft);}
  .riga-r .principale{font-weight:600;}
  .riga-r .dettaglio{color:var(--muted); font-size:13px;}
  .riga-r.chiarire .dettaglio{color:var(--bad);}
  .rendiconto .vuoto{color:var(--muted); font-size:14px; padding:4px 0;}
  .semine{margin-bottom:24px;}
  .semine h2{font-size:16px; margin:0 0 8px;}
  .sessione{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-top:8px;
  }
  .sessione h3{margin:0 0 2px; font-size:15px; text-transform:capitalize;}
  .sessione .tot{color:var(--muted); font-size:13px; margin-bottom:6px;}
  .sessione .var{padding:8px 0; border-top:1px solid var(--border);}
  .sessione .var:first-of-type{border-top:0;}
  .sessione .var .nome{display:flex; justify-content:space-between; gap:10px; font-weight:600;}
  .sessione .var .nome .g{color:var(--muted); font-weight:400; font-size:13px;}
  .sessione .dest{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:2px 0 0 10px;}
  .sessione .dest .d{color:var(--muted); font-size:13px;}
  .sessione .nota{color:var(--bad); font-size:13px; padding:0 0 2px 10px;}
  .semine .avviso{background:var(--bad-soft); color:var(--bad); border-radius:10px; padding:8px 12px; margin-top:8px; font-size:13px;}
  .semine .avviso .n{font-weight:400; margin:2px 0 6px;}
  .semine .avviso .ord{color:var(--text); padding:4px 0; border-top:1px solid var(--border);}
  .semine .avviso .ord .v{color:var(--muted);}
  .semine .vuoto,.semine .piu{color:var(--muted); font-size:14px; padding:4px 0;}
  .incassi{margin-bottom:24px;}
  .incassi h2{font-size:16px; margin:0 0 8px;}
  .incassi .cliente{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-top:8px;
  }
  .incassi .cliente h3{margin:0 0 6px; font-size:15px;}
  .incassi label.cons{display:flex; gap:10px; align-items:flex-start; padding:5px 0; font-size:14px; cursor:pointer;}
  .incassi label.cons input{margin-top:4px; width:18px; height:18px; flex:none;}
  .incassi .cons .dettaglio{color:var(--muted); font-size:13px;}
  .incassi .cons .vecchia{color:var(--bad);}
  .incassi .azioni{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px;}
  .incassi select{
    font:inherit; font-size:15px; padding:11px 10px; border-radius:10px; margin-top:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .incassi .vuoto{color:var(--muted); font-size:14px; padding:4px 0;}

  /* --- navigazione a 4 schermate --- */
  .wrap{padding-bottom:96px;}
  .testa{margin-bottom:16px;}
  .vista{display:none;}
  .vista.attiva{display:block;}
  .menu{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .menu .dentro{display:flex; max-width:640px; margin:0 auto;}
  .menu a{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 4px 8px; font-size:12px; font-weight:600; text-decoration:none;
    color:var(--muted); position:relative; -webkit-tap-highlight-color:transparent;
  }
  .menu a svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .menu a[aria-current="page"]{color:var(--accent);}
  .menu a[aria-current="page"]::before{
    content:""; position:absolute; top:-1px; left:22%; right:22%; height:3px;
    background:var(--accent); border-radius:0 0 3px 3px;
  }
  .menu a:focus-visible{outline:2px solid var(--accent); outline-offset:-4px; border-radius:10px;}
  .menu .badge{
    position:absolute; top:4px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px;
    border-radius:9px; background:var(--bad); color:#fff; font-size:11px; line-height:18px; text-align:center;
  }
  .menu .badge[hidden]{display:none;}
  .incassi h2,.semine h2{margin-top:0;}
  #risultatiIncassi:empty{display:none;}
  #risultatiIncassi{margin-bottom:22px;}

  /* --- magazzino --- */
  .magazzino h2{font-size:16px; margin:22px 0 8px;}
  .magazzino h2:first-child{margin-top:0;}
  .magazzino .nota-sistema{color:var(--muted); font-size:13px; margin:0 0 12px;}
  .tessere{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .tessera{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .tessera .num{font-size:24px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums;}
  .tessera .num small{font-size:13px; font-weight:600; color:var(--muted); margin-left:2px;}
  .tessera .et{color:var(--muted); font-size:12px; margin-top:2px;}
  .stadio{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-top:8px;}
  .stadio .testa-stadio{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .stadio .nome{font-weight:600;}
  .stadio .tot{font-variant-numeric:tabular-nums; font-weight:700;}
  .stadio .tot small{color:var(--muted); font-weight:400; font-size:12px;}
  .barra{height:6px; border-radius:3px; background:var(--border); margin-top:6px; overflow:hidden;}
  .barra > i{display:block; height:100%; background:var(--accent); border-radius:3px;}
  .stadio.fuori .barra > i{background:var(--muted);}
  .stadio .semina{
    display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:5px 0;
    border-top:1px solid var(--border);
  }
  .stadio .semina:first-of-type{margin-top:8px;}
  .stadio .semina .d{color:var(--muted); font-size:13px; text-align:right;}
  .stadio .semina .ignoto{color:var(--bad); font-weight:600;}
  .stadio.vuoto-stadio{opacity:.6;}
  .gruppo-seme{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-top:8px;}
  .gruppo-seme .testa-stadio{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .lotto{padding:8px 0; border-top:1px solid var(--border); font-size:14px;}
  .gruppo-seme .testa-stadio + .lotto{margin-top:8px;}
  .lotto .riga-l{display:flex; justify-content:space-between; gap:10px;}
  .lotto .d{color:var(--muted); font-size:13px;}
  .lotto .scad{color:var(--bad); font-weight:600;}
  .lotto .anom{background:var(--bad-soft); color:var(--bad); border-radius:8px; padding:4px 8px; font-size:13px; margin-top:4px;}
  .materiale{
    display:flex; justify-content:space-between; gap:10px; align-items:baseline;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-top:6px; font-size:14px;
  }
  .materiale .d{color:var(--muted); font-size:13px;}
  .materiale .q{font-weight:700; font-variant-numeric:tabular-nums; text-align:right;}
  .materiale .q small{display:block; color:var(--muted); font-weight:400; font-size:12px;}
  .magazzino .vuoto{color:var(--muted); font-size:14px; padding:4px 0;}
  .magazzino .avviso-set{background:var(--bad-soft); color:var(--bad); border-radius:10px; padding:8px 12px; margin-top:8px; font-size:13px;}
  .per-varieta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .per-varieta span{background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:13px;}
  .per-varieta b{font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: no-preference){ .barra > i{transition:width .3s ease;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="testa">
    <h1 id="titolo">Oggi</h1>
    <div class="sub" id="sottotitolo"></div>
  </div>

  <section id="vista-oggi" class="vista" aria-labelledby="titolo">
    <div id="rendiconto" class="rendiconto"><div class="vuoto">Carico il rendiconto di oggi…</div></div>

    <textarea id="testo" placeholder='Es. "Mizuna e Rábano sono passate in luce", "Seminato 2 set di rucola", "Splash ha pagato in contanti"'></textarea>
    <div>
      <button id="btnInterpreta">Interpreta</button>
    </div>
    <div id="stato" class="stato"></div>
    <div id="risultati"></div>
  </section>

  <section id="vista-incassi" class="vista">
    <div id="statoIncassi" class="stato"></div>
    <div id="risultatiIncassi"></div>
    <div id="incassi" class="incassi"><div class="vuoto">Carico le consegne da incassare…</div></div>
  </section>

  <section id="vista-semine" class="vista">
    <div id="semine" class="semine"><div class="vuoto">Carico il piano semine…</div></div>
  </section>

  <section id="vista-magazzino" class="vista">
    <div id="magazzino" class="magazzino"><div class="vuoto">Carico il magazzino…</div></div>
  </section>
</div>

<nav class="menu" aria-label="Schermate">
  <div class="dentro">
    <a href="#oggi" data-vista="oggi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      Oggi
    </a>
    <a href="#incassi" data-vista="incassi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v.01M18 14.5v.01"/></svg>
      Incassi<span class="badge" id="badgeIncassi" hidden></span>
    </a>
    <a href="#semine" data-vista="semine">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 5.5 4.5 5.5 4.5 10 7.5 12 12 12Z"/><path d="M12 14c0-3.2 2.4-5.5 7.5-5.5 0 4-3 5.5-7.5 5.5Z"/></svg>
      Semine
    </a>
    <a href="#magazzino" data-vista="magazzino">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5 12 4l9 4.5v9L12 22l-9-4.5Z"/><path d="M3 8.5 12 13l9-4.5M12 13v9"/></svg>
      Magazzino
    </a>
  </div>
</nav>

<script>
const testoEl = document.getElementById("testo");
const statoEl = document.getElementById("stato");
const risultatiEl = document.getElementById("risultati");
const btnInterpreta = document.getElementById("btnInterpreta");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function campo(k, v) {
  return `<div class="riga"><span class="k">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`;
}

function cardProposta(p, idx) {
  const div = document.createElement("div");
  div.className = "card";
  if (p.tipo === "semina_commission") {
    div.innerHTML = `
      <h3>Nuova semina — ${escapeHtml(p.varieta_nome)}</h3>
      ${campo("Set", p.num_set)}
      ${campo("Grammi", p.grammi + " g")}
      ${campo("Lotto seme", p.lotto_seme_public_id)}
      ${campo("Protocollo", p.protocollo_versione_public_id)}
      ${campo("Origine", p.origin)}
      ${campo("Avvio", p.physical_started_at)}
      ${campo("Residuo dopo", p.residuo_dopo + " g")}
    `;
  } else if (p.tipo === "pagamento_consegna") {
    const consegne = p.consegne.map((c) =>
      `<div class="riga"><span class="k">${escapeHtml(c.codice)} · ${escapeHtml(c.data)}</span>` +
      `<span>${escapeHtml((c.voci || []).join(", ") || "—")}</span></div>`).join("");
    div.innerHTML = `
      <h3>Pagamento — ${escapeHtml(p.cliente_nome)}</h3>
      ${consegne}
      ${campo("Metodo", p.metodo)}
      ${campo("Data pagamento", p.data_pagamento)}
      ${p.importo ? campo("Importo", p.importo) : ""}
    `;
  } else {
    div.innerHTML = `
      <h3>Cambio stadio — ${escapeHtml(p.varieta_nome)}</h3>
      ${campo("Semina", p.semina_public_id)}
      ${campo("Da", p.stato_attuale)}
      ${campo("A", p.passi[p.passi.length - 1])}
      ${p.passi.length > 1 ? campo("Passi", p.passi.join(" → ")) : ""}
    `;
  }
  const btn = document.createElement("button");
  btn.textContent = "Conferma ed esegui";
  const btnAnnulla = document.createElement("button");
  btnAnnulla.textContent = "Annulla";
  btnAnnulla.className = "secondary";
  const esitoDiv = document.createElement("div");
  btn.onclick = async () => {
    btn.disabled = true; btnAnnulla.disabled = true;
    btn.textContent = "Eseguo…";
    try {
      const r = await fetch("/api/conferma", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({proposta: p}),
      });
      const data = await r.json();
      esitoDiv.className = "esito" + (data.ok ? "" : " fallito");
      esitoDiv.textContent = data.messaggio;
      btn.remove(); btnAnnulla.remove();
      if (data.ok && p.tipo === "pagamento_consegna") caricaIncassi();
    } catch (e) {
      esitoDiv.className = "esito fallito";
      esitoDiv.textContent = "Errore di rete: " + e;
    }
  };
  btnAnnulla.onclick = () => div.remove();
  div.appendChild(document.createElement("div"));
  const azioni = document.createElement("div");
  azioni.appendChild(btn); azioni.appendChild(btnAnnulla);
  div.appendChild(azioni);
  div.appendChild(esitoDiv);
  return div;
}

// "1.000000" -> "1", "0.500000" -> "0.5" (le quantità arrivano come testo decimale dal database)
function qta(s) { return /^-?\d+\.\d+$/.test(String(s)) ? String(s).replace(/0+$/, "").replace(/\.$/, "") : String(s); }

function rigaConsegna(x) {
  return `<div class="riga-r">
    <div><span class="principale">${escapeHtml(x.cliente)}</span> — ${escapeHtml(x.varieta)}</div>
    <div class="dettaglio">${escapeHtml(qta(x.quantita))} ${escapeHtml(x.unita)} · ${escapeHtml(x.ordine)}</div>
  </div>`;
}
function rigaChiarire(x) {
  return `<div class="riga-r chiarire">
    <div><span class="principale">${escapeHtml(x.cliente)}</span> — ${escapeHtml(x.varieta)}</div>
    <div class="dettaglio">${escapeHtml(x.motivo)}</div>
  </div>`;
}
function rigaSemina(x) {
  return `<div class="riga-r">
    <div><span class="principale">${escapeHtml(x.varieta)}</span> per ${escapeHtml(x.cliente)}</div>
    <div class="dettaglio">${escapeHtml(qta(x.quantita))} ${escapeHtml(x.unita)} · ${escapeHtml(x.stato)}</div>
  </div>`;
}

async function caricaRendiconto() {
  const el = document.getElementById("rendiconto");
  try {
    const r = await fetch("/api/rendiconto");
    const data = await r.json();
    if (data.errore) {
      el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`;
      return;
    }
    const nulla = !(data.da_chiarire || []).length && !(data.consegne || []).length
      && !(data.da_seminare || []).length;
    if (nulla) {
      el.innerHTML = `<div class="vuoto">Rendiconto del ${escapeHtml(data.data)}: nessuna consegna né semina in scadenza oggi.</div>`;
      return;
    }
    let html = "";
    if ((data.da_chiarire || []).length) {
      html += `<h2>Da chiarire</h2>` + data.da_chiarire.map(rigaChiarire).join("");
    }
    if ((data.consegne || []).length) {
      html += `<h2>Consegne di oggi</h2>` + data.consegne.map(rigaConsegna).join("");
    }
    if ((data.da_seminare || []).length) {
      html += `<h2>Da seminare oggi</h2>` + data.da_seminare.map(rigaSemina).join("");
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="errore">Rendiconto non caricato: ${escapeHtml(String(e))}</div>`;
  }
}
caricaRendiconto();

const statoIncassiEl = document.getElementById("statoIncassi");
const risultatiIncassiEl = document.getElementById("risultatiIncassi");

function mostraEsito(data) {
  const dove = risultatiIncassiEl;
  dove.innerHTML = "";
  (data.proposte || []).forEach((p, i) => dove.appendChild(cardProposta(p, i)));
  (data.errori || []).forEach((e) => {
    const d = document.createElement("div");
    d.className = "errore";
    d.textContent = e;
    dove.appendChild(d);
  });
  dove.scrollIntoView({behavior: "smooth", block: "start"});
}

async function preparaPagamento(codici, metodo) {
  statoIncassiEl.textContent = "Preparo la proposta…";
  try {
    const r = await fetch("/api/pagamento/prepara", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({consegne: codici, metodo}),
    });
    statoIncassiEl.textContent = "";
    mostraEsito(await r.json());
  } catch (e) {
    statoIncassiEl.textContent = "Errore: " + e;
  }
}

function bloccoCliente(c, metodi) {
  const div = document.createElement("div");
  div.className = "cliente";
  const righe = c.consegne.map((x) => {
    const vecchia = x.giorni >= 14 ? " vecchia" : "";
    const quanto = x.giorni === 1 ? "1 giorno" : x.giorni + " giorni";
    return `<label class="cons"><input type="checkbox" value="${escapeHtml(x.codice)}" checked>
      <span><strong>${escapeHtml(x.codice)}</strong> · ${escapeHtml(x.data)}
      <span class="dettaglio${vecchia}">(${escapeHtml(quanto)})</span><br>
      <span class="dettaglio">${escapeHtml(x.voci.join(", ") || "—")}</span></span></label>`;
  }).join("");
  const opzioni = `<option value="">Metodo…</option>` +
    metodi.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
  div.innerHTML = `<h3>${escapeHtml(c.cliente)}</h3>${righe}
    <div class="azioni"><select>${opzioni}</select><button type="button">Segna come pagate</button></div>`;
  const sel = div.querySelector("select");
  div.querySelector("button").onclick = () => {
    const scelte = [...div.querySelectorAll("input:checked")].map((i) => i.value);
    if (!scelte.length) { statoIncassiEl.textContent = "Seleziona almeno una consegna."; return; }
    if (!sel.value) { statoIncassiEl.textContent = "Scegli il metodo di pagamento."; return; }
    preparaPagamento(scelte, sel.value);
  };
  return div;
}

async function caricaIncassi() {
  const el = document.getElementById("incassi");
  try {
    const r = await fetch("/api/da-incassare");
    const data = await r.json();
    if (data.errore) {
      el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`;
      return;
    }
    if (!(data.clienti || []).length) {
      el.innerHTML = `<h2>Da incassare</h2><div class="vuoto">Tutte le consegne sono pagate.</div>`;
      impostaBadge(0);
      return;
    }
    const n = data.clienti.reduce((a, c) => a + c.consegne.length, 0);
    impostaBadge(n);
    el.innerHTML = `<h2>Da incassare · ${n} consegn${n === 1 ? "a" : "e"}, ${data.clienti.length} client${data.clienti.length === 1 ? "e" : "i"}</h2>`;
    data.clienti.forEach((c) => el.appendChild(bloccoCliente(c, data.metodi)));
  } catch (e) {
    el.innerHTML = `<div class="errore">Elenco non caricato: ${escapeHtml(String(e))}</div>`;
  }
}
caricaIncassi();

function numero(x) { return String(x); }
function dataBreve(iso) { const [, m, d] = iso.split("-"); return `${d}/${m}`; }

async function caricaSemine() {
  const el = document.getElementById("semine");
  try {
    const r = await fetch("/api/sessioni-semina");
    const data = await r.json();
    if (data.errore) { el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`; return; }
    el.innerHTML = `<h2>Prossime semine · ${escapeHtml(data.giorni.join(" e "))}</h2>`;
    if (!data.sessioni.length) {
      el.insertAdjacentHTML("beforeend", `<div class="vuoto">Nessuna semina da fare nelle sessioni.</div>`);
    }
    data.sessioni.forEach((s) => {
      const tot = Object.entries(s.totali).map(([u, q]) => `${q} ${u}`).join(", ");
      const vars = s.varieta.map((v) => {
        const dest = v.destinatari.map((d) => `
          <div class="dest"><span>${escapeHtml(d.cliente)} · ${escapeHtml(d.quantita)}</span>
          <span class="d">consegna ${escapeHtml(dataBreve(d.consegna))} · ${escapeHtml(d.ordine)}</span></div>` +
          d.note.map((n) => `<div class="nota">${escapeHtml(n)}</div>`).join("")).join("");
        return `<div class="var"><div class="nome"><span>${escapeHtml(v.varieta)} · ${escapeHtml(v.quantita)} ${escapeHtml(v.unita)}</span>
          <span class="g">${escapeHtml(v.grammi)} g di seme</span></div>${dest}</div>`;
      }).join("");
      el.insertAdjacentHTML("beforeend", `<div class="sessione"><h3>${escapeHtml(s.giorno)} ${escapeHtml(dataBreve(s.data))}${s.oggi ? " · oggi" : ""}</h3>
        <div class="tot">${s.varieta.length} varietà · ${escapeHtml(tot)}</div>${vars}</div>`);
    });
    if (data.piu_avanti) {
      el.insertAdjacentHTML("beforeend", `<div class="piu">Più avanti: ${data.piu_avanti === 1 ? "un'altra riga" : "altre " + data.piu_avanti + " righe"}, fino al ${escapeHtml(dataBreve(data.ultima_data_piu_avanti))}.</div>`);
    }
    const elencoOrdini = (titolo, nota, ordini, ritardo) => {
      if (!ordini.length) return;
      const righe = ordini.map((o) => `<div class="ord"><b>${escapeHtml(o.cliente)}</b> · ${escapeHtml(o.ordine)}
        · ${ritardo ? "consegna" : "prevista"} ${escapeHtml(dataBreve(o.consegna))}${ritardo ? ` · piano in ritardo di ${o.ritardo_giorni} gg` : ""}
        <div class="v">${o.voci.map(escapeHtml).join(", ")}</div></div>`).join("");
      el.insertAdjacentHTML("beforeend", `<div class="avviso"><b>${escapeHtml(titolo)} (${ordini.length})</b>
        <div class="n">${escapeHtml(nota)}</div>${righe}</div>`);
    };
    elencoOrdini("Da verificare", "Consegna troppo vicina per una semina nuova: coperti da giacenza o semine in corso? Consegna da spostare?",
      data.da_verificare || [], true);
    elencoOrdini("Ordini scaduti", "Consegna prevista passata e ordine ancora aperto: se il residuo non è più dovuto, da chiudere.",
      data.scaduti || [], false);
  } catch (e) {
    el.innerHTML = `<div class="errore">Piano semine non caricato: ${escapeHtml(String(e))}</div>`;
  }
}
caricaSemine();

/* ---------- Magazzino (sola lettura) ---------- */
const NOMI_STADIO = {
  AVVIATA: "Appena avviate", GERMINAZIONE: "Germinazione", LUCE: "Luce", CRESCITA: "Crescita",
  PRONTA_ALLA_RACCOLTA: "Pronte alla raccolta",
};
function dataLunga(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function giorniA(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - oggi) / 86400000);
}
function percento(a, b) { const x = parseFloat(a), y = parseFloat(b); return y > 0 ? Math.max(0, Math.min(100, (x / y) * 100)) : 0; }

function htmlColtivazione(c) {
  const massimo = Math.max(1, ...c.stadi.map((s) => parseFloat(s.set)));
  let html = `<h2>In coltivazione</h2>
    <div class="nota-sistema">SET attesi tra germinazione e crescita. Appena avviate e pronte alla raccolta sono a parte.</div>`;
  c.stadi.forEach((s) => {
    const fuori = s.stadio === "AVVIATA" || s.stadio === "PRONTA_ALLA_RACCOLTA";
    const righe = s.elenco.map((x) => `<div class="semina">
        <span><b>${escapeHtml(x.varieta)}</b> <span class="d">${escapeHtml(x.codice)}</span></span>
        <span class="d">${x.set === null ? '<span class="ignoto">SET ?</span>' : escapeHtml(x.set) + " SET"} · dal ${escapeHtml(dataBreve(x.avvio))}${x.raccolto ? " · raccolti " + escapeHtml(x.raccolto) : ""}</span></div>`).join("");
    html += `<div class="stadio${fuori ? " fuori" : ""}${s.semine ? "" : " vuoto-stadio"}">
      <div class="testa-stadio"><span class="nome">${escapeHtml(NOMI_STADIO[s.stadio] || s.stadio)}</span>
        <span class="tot">${escapeHtml(s.set)} <small>SET · ${s.semine} ${s.semine === 1 ? "semina" : "semine"}</small></span></div>
      <div class="barra"><i style="width:${percento(s.set, massimo)}%"></i></div>${righe}</div>`;
  });
  if (c.senza_set.length) {
    html += `<div class="avviso-set">Resa attesa non compilata (non contate nel totale): ${c.senza_set.map(escapeHtml).join(", ")}</div>`;
  }
  if (c.per_varieta.length) {
    html += `<div class="per-varieta">${c.per_varieta.map((v) => `<span>${escapeHtml(v.varieta)} <b>${escapeHtml(v.set)}</b></span>`).join("")}</div>`;
  }
  return html;
}

function htmlSemi(s) {
  let html = `<h2>Semi</h2>`;
  if (!s.referenze.length) return html + `<div class="vuoto">Nessun lotto di seme a sistema.</div>`;
  s.referenze.forEach((g) => {
    const lotti = g.lotti.map((l) => {
      const gg = l.scadenza ? giorniA(l.scadenza) : null;
      const scad = l.scadenza
        ? (gg < 0 ? `<span class="scad">scaduto il ${escapeHtml(dataLunga(l.scadenza))}</span>`
          : gg <= 60 ? `<span class="scad">scade il ${escapeHtml(dataLunga(l.scadenza))}</span>`
          : `scade il ${escapeHtml(dataLunga(l.scadenza))}`)
        : "senza scadenza";
      return `<div class="lotto">
        <div class="riga-l"><span><b>${escapeHtml(l.lotto)}</b> · ${escapeHtml(l.fornitore)}</span>
          <span><b>${escapeHtml(l.residuo)}</b> <span class="d">/ ${escapeHtml(l.iniziale)} g</span></span></div>
        <div class="barra"><i style="width:${percento(l.residuo, l.iniziale)}%"></i></div>
        <div class="d">lotto ${escapeHtml(l.lotto_produttore)} · ricevuto ${escapeHtml(dataLunga(l.ricevuto))} · ${scad}${l.seminato_per.length ? " · usato per " + l.seminato_per.map(escapeHtml).join(", ") : ""}</div>
        ${l.anomalia ? `<div class="anom">${escapeHtml(l.anomalia)}</div>` : ""}</div>`;
    }).join("");
    html += `<div class="gruppo-seme"><div class="testa-stadio"><span class="nome"><b>${escapeHtml(g.referenza)}</b></span>
      <span class="tot"><b>${escapeHtml(g.residuo)}</b> <small>g residui</small></span></div>${lotti}</div>`;
  });
  return html;
}

function htmlMateriali(m) {
  let html = `<h2>Materiali</h2><div class="nota-sistema">Regola di consumo: ${m.pezzi_per_set} vaschette + ${m.pezzi_per_set} substrati per SET.</div>`;
  if (!m.articoli.length) return html + `<div class="vuoto">Nessun articolo a sistema.</div>`;
  m.articoli.forEach((a) => {
    html += `<div class="materiale"><div><b>${escapeHtml(a.nome)}</b><div class="d">${escapeHtml(a.codice)} · ultimo movimento ${escapeHtml(dataLunga(a.ultimo_movimento))}</div></div>
      <div class="q">${escapeHtml(a.giacenza)} <span class="d">${escapeHtml(a.unita === "UNIT" ? "pz" : a.unita.toLowerCase())}</span>
        ${a.set_possibili !== null ? `<small>bastano per ${escapeHtml(a.set_possibili)} SET</small>` : ""}</div></div>`;
  });
  return html;
}

let magazzinoCaricatoAlle = 0;
async function caricaMagazzino() {
  const el = document.getElementById("magazzino");
  try {
    const r = await fetch("/api/magazzino");
    const data = await r.json();
    if (data.errore) { el.innerHTML = `<div class="errore">${escapeHtml(data.errore)}</div>`; return; }
    const sets = data.materiali.set_possibili;
    el.innerHTML = `
      <div class="nota-sistema">Numeri del sistema, non un conteggio fisico.</div>
      <div class="tessere">
        <div class="tessera"><div class="num">${escapeHtml(data.coltivazione.in_semina.set)}<small>SET</small></div><div class="et">in coltivazione</div></div>
        <div class="tessera"><div class="num">${escapeHtml(data.semi.totale_g)}<small>g</small></div><div class="et">semi residui</div></div>
        <div class="tessera"><div class="num">${sets === null ? "—" : escapeHtml(sets)}<small>SET</small></div><div class="et">coi materiali</div></div>
      </div>` + htmlColtivazione(data.coltivazione) + htmlSemi(data.semi) + htmlMateriali(data.materiali);
    magazzinoCaricatoAlle = Date.now();
  } catch (e) {
    el.innerHTML = `<div class="errore">Magazzino non caricato: ${escapeHtml(String(e))}</div>`;
  }
}

/* ---------- Navigazione tra le 4 schermate ---------- */
const VISTE = {
  oggi: "Cosa c'è da fare oggi. Scrivi cosa è successo: ti mostro l'azione esatta prima di registrarla.",
  incassi: "Consegne fatte e non ancora pagate.",
  semine: "Cosa seminare nelle prossime sessioni, e per chi.",
  magazzino: "Cosa c'è in casa e cosa sta crescendo.",
};
const TITOLI = {oggi: "Oggi", incassi: "Incassi", semine: "Semine", magazzino: "Magazzino"};

function impostaBadge(n) {
  const b = document.getElementById("badgeIncassi");
  b.textContent = n > 99 ? "99+" : String(n);
  b.hidden = !n;
}

function mostraVista(nome) {
  if (!VISTE[nome]) nome = "oggi";
  document.querySelectorAll(".vista").forEach((v) => v.classList.toggle("attiva", v.id === "vista-" + nome));
  document.querySelectorAll(".menu a").forEach((a) => {
    if (a.dataset.vista === nome) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.getElementById("titolo").textContent = TITOLI[nome];
  document.getElementById("sottotitolo").textContent = VISTE[nome];
  document.title = TITOLI[nome] + " — Tower Power";
  if (nome === "magazzino" && Date.now() - magazzinoCaricatoAlle > 60000) caricaMagazzino();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".menu a").forEach((a) => {
  a.addEventListener("click", (ev) => {
    ev.preventDefault();
    history.pushState(null, "", "#" + a.dataset.vista);
    mostraVista(a.dataset.vista);
  });
});
window.addEventListener("popstate", () => mostraVista(location.hash.slice(1)));
mostraVista(location.hash.slice(1));

btnInterpreta.onclick = async () => {
  const testo = testoEl.value.trim();
  if (!testo) return;
  btnInterpreta.disabled = true;
  statoEl.textContent = "Interpreto…";
  risultatiEl.innerHTML = "";
  try {
    const r = await fetch("/api/interpreta", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({testo}),
    });
    const data = await r.json();
    statoEl.textContent = "";
    (data.proposte || []).forEach((p, i) => risultatiEl.appendChild(cardProposta(p, i)));
    (data.errori || []).forEach((e) => {
      const d = document.createElement("div");
      d.className = "errore";
      d.textContent = e;
      risultatiEl.appendChild(d);
    });
    if (!(data.proposte || []).length && !(data.errori || []).length) {
      statoEl.textContent = "Nessuna proposta.";
    }
  } catch (e) {
    statoEl.textContent = "Errore: " + e;
  } finally {
    btnInterpreta.disabled = false;
  }
};
